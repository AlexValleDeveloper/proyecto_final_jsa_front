<section class="max-w-7xl mx-auto p-8">

  @if (item()) {

    <div class="grid md:grid-cols-2 gap-12">

      <!-- Imagen -->
      <div>
       <img
  [src]="item()!.image"
  [alt]="item()!.name"
  class="w-full rounded-lg shadow-lg"
/>
      </div>

      <!-- Información -->
      <div>

        <h1 class="text-6xl font-bold mb-6">
          {{ item()!.name }}
        </h1>

        <p class="text-2xl text-gray-700 mb-8">
          {{ item()!.description }}
        </p>

        <p class="text-5xl font-bold text-[#630321] mb-8">
          {{ item()!.price }} €
        </p>

        <p class="text-2xl mb-8">
          Stock disponible: {{ item()!.stock }}
        </p>

        <button
          (click)="addToCart()"
          class="bg-[#630321] text-white px-8 py-4 text-xl hover:bg-[#4d0219] transition"
        >
          Añadir al carrito
        </button>

        @if (message()) {
          <p class="mt-4 text-green-600 font-semibold">
            {{ message() }}
          </p>
        }

      </div>

    </div>

  }

</section>
