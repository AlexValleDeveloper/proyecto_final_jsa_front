<section class="max-w-7xl mx-auto p-8">

  @if (community()) {

    <h1 class="inline-block text-5xl font-bold border-l-8 border-[#630321] pl-4 mb-8">
      {{ community()?.name }}
    </h1>

  }

  <div class="grid md:grid-cols-4 gap-4 mb-10">

    <input
      type="text"
      placeholder="Buscar producto"
      class="border border-[#dcc0c2] p-3 rounded-md bg-white text-[#1a1c1b] outline-none focus:border-[#630321] focus:ring-1 focus:ring-[#630321]"
      #searchInput
      (input)="search.set(searchInput.value); loadItems()"
    >

    <select
      class="border border-[#dcc0c2] p-3 rounded-md bg-white text-[#1a1c1b] outline-none focus:border-[#630321] focus:ring-1 focus:ring-[#630321]"
      #categorySelect
      (change)="category.set(categorySelect.value ? +categorySelect.value : undefined); loadItems()"
    >
      <option value="">Todas</option>
      <option value="1">Bebidas</option>
      <option value="2">Productos</option>
    </select>

    <input
      type="number"
      placeholder="Precio mínimo"
      class="border border-[#dcc0c2] p-3 rounded-md bg-white text-[#1a1c1b] outline-none focus:border-[#630321] focus:ring-1 focus:ring-[#630321]"
      #minInput
      (input)="minPrice.set(minInput.value ? +minInput.value : undefined); loadItems()"
    >

    <input
      type="number"
      placeholder="Precio máximo"
      class="border border-[#dcc0c2] p-3 rounded-md bg-white text-[#1a1c1b] outline-none focus:border-[#630321] focus:ring-1 focus:ring-[#630321]"
      #maxInput
      (input)="maxPrice.set(maxInput.value ? +maxInput.value : undefined); loadItems()"
    >

  </div>

  <p class="mb-8 text-lg font-medium text-[#564244]">
  <span class="text-[#630321] font-bold">
    {{ items().length }}
  </span>
  productos encontrados
</p>

  @if (items().length > 0) {

    <div class="grid md:grid-cols-3 gap-6">

      @for (item of items(); track item.id) {
        <app-product-card [item]="item"></app-product-card>
      }

    </div>

  } @else {

    <p class="text-center py-12 text-[#564244]">
      No se encontraron productos.
    </p>

  }

</section>
