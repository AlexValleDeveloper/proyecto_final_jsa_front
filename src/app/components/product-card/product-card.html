<article
  [routerLink]="['/items', item().id]"
  class="border border-[#dcc0c2] bg-white overflow-hidden cursor-pointer hover:shadow-lg transition"
>

  <img
  [src]="item().image"
  [alt]="item().name"
  class="h-64 w-full object-cover"
/>

  <div class="p-6">

    <h3 class="text-2xl font-bold text-[#1a1c1b]">
      {{ item().name }}
    </h3>

    <p class="mt-3 text-[#564244]">
      {{ item().description }}
    </p>

    <p class="mt-4 text-xl font-semibold text-[#630321]">
      {{ item().price }} €
    </p>

  </div>

</article>
